site_name: Nam Vu — Notes
site_description: Technical notes and project documentation by Vu Hoang Nam.
site_url: https://nanotnam.github.io/docs/
docs_dir: docs

theme:
  name: material
  language: en
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  icon:
    logo: material/folder-text
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Home: index.md
  - Projects: projects.md
  - Notes: notes.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/retro.css

repo_url: https://github.com/nanotnam/nanotnam.github.io
repo_name: nanotnam.github.io

strict: true
