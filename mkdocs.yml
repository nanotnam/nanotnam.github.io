site_name: Nam Vu — Notes
site_description: Technical notes and project documentation by Vu Hoang Nam.
site_url: https://nanotnam.github.io/docs/
docs_dir: docs

theme:
  name: mkdocs
  locale: en

nav:
  - Home: index.md
  - Projects: projects.md
  - Notes: notes.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - fenced_code
  - tables
  - toc:
      permalink: true

strict: true
